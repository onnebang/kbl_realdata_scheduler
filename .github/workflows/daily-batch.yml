name: KBL Daily Batch

on:
  schedule:
    # 21:00 UTC(전날) = 06:00 KST
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-batch
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: onnebang/kbl_realdata
  # 비공개 저장소의 검토 완료 커밋만 실행한다(읽기 전용 deploy key로 체크아웃). 수집기 변경을 배포할 때 두 workflow를 함께 올릴 것.
  SOURCE_REF: 03cba9e38ff3ec6a7e0b407359109a1e02132875

jobs:
  batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout audited batch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          path: source
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: source/tools/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement source/tools/requirements.txt

      - name: Run daily batch
        working-directory: source/tools
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python daily_batch.py
