name: KBL Daily Batch

on:
  schedule:
    # 21:00 UTC(전날) = 06:00 KST
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-batch
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: onnebang/kbl_realdata
  # 공개 저장소의 검토 완료 커밋만 실행한다. 수집기 변경을 배포할 때 두 workflow를 함께 올릴 것.
  SOURCE_REF: 03cba9e38ff3ec6a7e0b407359109a1e02132875

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout audited batch source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          path: source
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: source/tools/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement source/tools/requirements.txt

      - name: Run daily batch
        working-directory: source/tools
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python daily_batch.py

